plugins {
    alias(libs.plugins.androidLibrary)
    alias(libs.plugins.kotlinAndroid)
}

android {

//    buildToolsVersion "31.0.0-rc5"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        compileSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        //dataBinding = true
        // for view binding :
        buildConfig = true
        viewBinding = true
    }
    namespace 'com.limpu.component'
}

dependencies {
    implementation(libs.kotlinStdlib)
    implementation(libs.coreKtxLibrary)
    implementation(libs.appcompat)
    implementation(libs.lifecycleExtensions)

    implementation(libs.retrofitLegacy)
    //retrofit2的gson转换器
    implementation(libs.converterGsonLegacy)

    testImplementation(libs.junit)
    androidTestImplementation(libs.androidTestJunit)
    androidTestImplementation(libs.androidTestCore)
    androidTestImplementation(libs.androidTestRunner)
    androidTestImplementation(libs.mockWebServerLegacy)

}

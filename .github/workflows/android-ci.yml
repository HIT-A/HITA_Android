name: Android CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch layer dependency baseline
        if: github.event_name == 'pull_request'
        env:
          LAYER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$LAYER_BASE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository and documentation checks
        env:
          LAYER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/test_check_repository.py
          args=()
          if [[ -n "$LAYER_BASE_SHA" ]]; then
            args+=(--base-ref "$LAYER_BASE_SHA")
          fi
          python3 scripts/check_repository.py "${args[@]}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AndroidLiquidGlass/backdrop 为 Java 21 字节码，单测类加载需要 21
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 单元测试（纯 JVM，无模拟器）
      - name: Unit tests and timetable core JAR
        run: ./gradlew :timetable-core:test :timetable-core:jar :app:testDebugUnitTest :component:testDebugUnitTest :hitauser:testDebugUnitTest :style:testDebugUnitTest --console=plain --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            component/build/test-results/testDebugUnitTest/
            hitauser/build/test-results/testDebugUnitTest/
            style/build/test-results/testDebugUnitTest/
            timetable-core/build/test-results/test/
          if-no-files-found: error

      # Debug 编译（含 kapt/Hilt/Room 全链路）
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Verify style release resources
        run: ./gradlew :style:verifyReleaseResources :style:assembleRelease --rerun-tasks --no-build-cache --console=plain --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hita-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 设备测试：Room 迁移、课表存储、好友导入与 PDF 资源等全部 androidTest
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest :component:connectedDebugAndroidTest :hitauser:connectedDebugAndroidTest :style:connectedDebugAndroidTest --console=plain --no-daemon --no-parallel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            component/build/outputs/androidTest-results/connected/
            component/build/reports/androidTests/connected/
            hitauser/build/outputs/androidTest-results/connected/
            hitauser/build/reports/androidTests/connected/
            style/build/outputs/androidTest-results/connected/
            style/build/reports/androidTests/connected/
          if-no-files-found: error

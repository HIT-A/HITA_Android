name: Android CI

# PR merge gate. Deep compatibility, performance, security, and scheduled matrices
# are intentionally out of this workflow until a separate runner budget exists.
# Do not add pull_request_target: this workflow executes repository code.

on:
  push:
    branches: [main, master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch layer dependency baseline
        if: github.event_name == 'pull_request'
        env:
          LAYER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$LAYER_BASE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Repository and documentation checks
        env:
          LAYER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/repository-checks.sh

  jvm-tests:
    name: JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Unit tests and timetable core JAR
        run: bash scripts/ci/gradle.sh :timetable-core:test :timetable-core:jar :app:testDebugUnitTest :component:testDebugUnitTest :hitauser:testDebugUnitTest :style:testDebugUnitTest

      - name: Upload JVM test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unit-test-results
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/test-results/testDebugUnitTest/
            component/build/test-results/testDebugUnitTest/
            hitauser/build/test-results/testDebugUnitTest/
            style/build/test-results/testDebugUnitTest/
            timetable-core/build/test-results/test/

  build:
    name: Debug build and style release resources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Assemble debug
        run: bash scripts/ci/gradle.sh :app:assembleDebug

      - name: Verify style release resources
        run: bash scripts/ci/gradle.sh :style:verifyReleaseResources :style:assembleRelease --rerun-tasks --no-build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hita-debug-apk
          retention-days: 14
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

  device-tests:
    name: API 35 instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Enable emulator acceleration
        run: bash scripts/ci/enable-kvm.sh

      # One fresh AVD per job. google_apis matches the local hita_test image;
      # the previous default image was AOSP and is not the local contract.
      - name: Connected tests on API 35
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: bash scripts/ci/instrumentation.sh

      - name: Upload device test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: device-test-results
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            component/build/outputs/androidTest-results/connected/
            component/build/reports/androidTests/connected/
            hitauser/build/outputs/androidTest-results/connected/
            hitauser/build/reports/androidTests/connected/
            style/build/outputs/androidTest-results/connected/
            style/build/reports/androidTests/connected/

      - name: Upload emulator diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: emulator-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/hita-ci-diagnostics/

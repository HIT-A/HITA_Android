    implementation(libs.lifecycleExtensions)
    // Kotlin
    implementation(libs.activityKtxLegacy)
    implementation(libs.wheelView)
    testImplementation(libs.junitLegacy)
    testImplementation(libs.junitJupiter)//滚轮选择器

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dagger.hilt.android.plugin'
}

// versionCode：优先使用 CI/发布脚本注入的 VERSION_CODE 环境变量（单调递增由发布方保证），
// 否则回退到显式基线值，避免误用 git 提交数导致版本回退。
def envVersionCode = System.getenv("VERSION_CODE")
def appVersionCodeValue = (envVersionCode != null && envVersionCode.matches("\\d+"))
    ? Integer.parseInt(envVersionCode)
    : 2026082802
def appVersionNameValue = "2.6.4"

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def resolveSecret = { String propertyName, String environmentName ->
    def candidates = [
        keystoreProperties.getProperty(propertyName),
        keystoreProperties.getProperty(environmentName),
        localProperties.getProperty(propertyName),
        localProperties.getProperty(environmentName),
        project.findProperty(propertyName)?.toString(),
        project.findProperty(environmentName)?.toString(),
        System.getenv(environmentName),
    ]
    candidates.find { it != null && !it.trim().isEmpty() }?.trim() ?: ""
}

def buildConfigString = { String value ->
    "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}

def deepSeekApiKey = resolveSecret("deepseekApiKey", "DEEPSEEK_API_KEY")
def zhipuApiKey = resolveSecret("zhipuApiKey", "ZHIPU_API_KEY")

android {
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "cn.limpu.hita"
        minSdkVersion 26
        targetSdk 35
        compileSdk 35
        versionCode appVersionCodeValue
        versionName appVersionNameValue
        resConfigs "zh", "en"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation":
                                     "$projectDir/schemas".toString()]
            }
        }

        buildConfigField "String", "HOA_BASE_URL", '"https://api.hita.limpu.cn"'
        // 统一入口：nginx 按路径分发（/api/usage|notices|visit|stats → hita-api；/api/courses|rag|... → agent-backend；/v1/* → course-server）
        buildConfigField "String", "AGENT_BACKEND_BASE_URL", '"https://api.hita.limpu.cn"'
        buildConfigField "String", "HOA_API_KEY", '""'
        buildConfigField "String", "UPDATE_URL", '"https://github.com/HIT-A/HITA_Android/releases/latest"'
        buildConfigField "String", "UPDATE_VERSION_NAME", "\"${appVersionNameValue}\""
        buildConfigField "long", "UPDATE_VERSION_CODE", "${appVersionCodeValue}L"
        buildConfigField "String", "UPDATE_LOG", '""'
        buildConfigField "boolean", "UPDATE_ALLOW_PRERELEASE", "true"
        buildConfigField "String", "DEEPSEEK_API_KEY", buildConfigString(deepSeekApiKey)
        buildConfigField "String", "ZHIPU_API_KEY", buildConfigString(zhipuApiKey)
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }
    buildTypes {
        debug {
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        exclude '**/*-sources.jar'
        exclude 'org/bouncycastle/pqc/**/*.properties'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'cn.limpu.hita'
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // Baseline Profile：release 构建自动应用启动路径 AOT 编译（规则见 src/main/baseline-prof.txt）
    implementation 'androidx.profileinstaller:profileinstaller:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('androidx.compose:compose-bom:2025.09.01')
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'dev.chrisbanes.haze:haze:0.7.3'
    implementation 'io.github.kyant0:backdrop:1.0.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.security:security-crypto:1.0.0'
    implementation project(path: ':component')
    implementation project(path: ':hitauser')
    implementation project(path: ':style')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation "androidx.room:room-runtime:2.8.4"
    kapt "androidx.room:room-compiler:2.8.4"

    //kotlin的viewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4"
    //Glide图片加载
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Retrofit2 + OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    //jsoup爬虫
    implementation 'org.jsoup:jsoup:1.18.2'

    //buttonLoading
    implementation 'br.com.simplepass:loading-button-android:2.2.0'
    //折叠布局
    implementation 'net.cachapa.expandablelayout:expandablelayout:2.9.2'

    //时间轴
    implementation 'com.github.alorma:timelineview:2.3.0'
    //圆形进度
    implementation 'com.github.lzyzsd:circleprogress:1.2.1'

    //多行collapsingToolbar
    implementation 'net.opacapp:multiline-collapsingtoolbar:27.1.1'

    implementation 'com.beloo.widget:ChipsLayoutManager:0.3.7@aar'//流式布局

    implementation 'com.cncoderx.wheelview:library:1.2.2'//滚轮选择器

    implementation 'org.mnode.ical4j:ical4j:1.0.2'

    //文档解析库 - PDF本地解析，Office使用4.x版本兼容Android
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0' //PDF解析（已添加资源文件）
    implementation 'org.apache.poi:poi-ooxml:4.1.2' //Word/Excel/PowerPoint解析
    implementation 'org.apache.poi:poi:4.1.2'

    // StAX API for Android 8.0+ (Apache POI dependency)
    implementation 'javax.xml.stream:stax-api:1.0-2'
    implementation 'com.fasterxml:aalto-xml:1.2.2'

    //爆炸效果
    implementation 'tyrantgit:explosionfield:1.0.1'

    // WorkManager for periodic course-snatching
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    implementation 'io.noties.markwon:image-glide:4.6.2'
    implementation 'io.noties.markwon:html:4.6.2'
    // syntax highlight removed (prism4j artifacts not available in current mirrors)
    implementation 'ru.noties:jlatexmath-android:0.2.0'

    // Hilt DI
    implementation 'com.google.dagger:hilt-android:2.57.2'
    kapt 'com.google.dagger:hilt-android-compiler:2.57.2'

    // Fragment KTX for by viewModels()
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
}

// Compatibility alias for tooling/scripts that still invoke :app:testClasses (Java plugin task).
tasks.register('testClasses') {
    group = 'verification'
    description = 'Compatibility task alias for legacy invocations; runs debug unit tests.'
    dependsOn 'testDebugUnitTest'
}

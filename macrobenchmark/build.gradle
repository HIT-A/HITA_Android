plugins {
    alias(libs.plugins.androidTest)
    alias(libs.plugins.kotlinAndroid)
}

android {
    namespace 'cn.limpu.hita.benchmark.test'
    compileSdk 36
    defaultConfig {
        minSdk 31
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // 模拟器采样只用于本地回归对比，不代表真机性能门；显式抑制并保留在报告里。
        testInstrumentationRunnerArguments['androidx.benchmark.suppressErrors'] = 'EMULATOR'
    }
    targetProjectPath = ':app'
    experimentalProperties['android.experimental.self-instrumenting'] = true
    buildTypes {
        benchmark {
            debuggable true
            // com.android.test 变体默认不带签名；缺签名会在安装时报 NO_CERTIFICATES。
            signingConfig = signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

androidComponents {
    beforeVariants(selector().all()) { it.enable = it.buildType == 'benchmark' }
}

dependencies {
    implementation(libs.androidTestJunit)
    implementation(libs.androidTestRunner)
    implementation(libs.uiautomator)
    implementation(libs.benchmarkMacroJunit4)
}
